# Builds the site and publishes it to GitHub Pages.
#
# The bundle in public/ is generated by esbuild and is not committed, so it is
# rebuilt here on every push. Nothing needs the Opus Magnum install: the assets
# the preview needs are committed (see the "Game assets" block in .gitignore),
# and the asset step is deliberately not run, because it would try to copy music
# and help art that are not in the repository.
#
# Enable once under Settings -> Pages -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let one deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Engine test-suite
        run: npm test

      - name: Build the site
        run: npm run build

      - name: Check the assets the preview needs are present
        run: |
          missing=0
          for f in \
            public/assets/textures/board.png \
            public/assets/atoms/salt_diffuse.png \
            public/assets/atoms/copper_diffuse.png \
            public/assets/atoms/quicksilver_symbol.png \
            public/assets/atoms/lighting_left.png \
            public/assets/atoms/elements/air_base.png \
            public/assets/atoms/elements/specular_highlight.png
          do
            if [ ! -f "$f" ]; then
              echo "::error::missing required asset: $f"
              missing=1
            fi
          done
          # A published build with no sound is expected, but the board must draw.
          if [ ! -f public/main.js ] || [ ! -f public/engine.js ]; then
            echo "::error::bundle not built"
            missing=1
          fi
          exit $missing

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
